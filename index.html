<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#7450ad 0%,#422a79 40%,#171a42 100%);background-attachment:fixed;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.sidebar{width:275px;flex-shrink:0;background:#14152b99;backdrop-filter:blur(18px);padding:24px 14px;border-left:1px solid #ffffff30}
.brand{text-align:center;padding:22px 8px;border-bottom:1px solid #ffffff25;margin-bottom:20px}
.brand .logo{font-size:38px;color:#d4b7ff}
.brand h2{font-size:18px;margin:10px 0}
.brand small{color:#c9b7ee}
.nav{display:block;width:100%;text-align:right;background:transparent;border:0;color:#e5def5;padding:13px;border-radius:12px;margin:4px 0;font-size:13px}
.nav:hover,.nav.active{background:#aa85f144;color:white}
.main{flex:1;min-width:0;padding:30px;max-width:1500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}

.hero h1{font-size:clamp(28px,4vw,48px);margin:14px 0;color:#fff}
.hero p{color:#e7dff8;line-height:2;max-width:650px}
.accent{color:#d7bbff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px;margin-top:24px}
.card{background:#ffffff17;border:1px solid #ffffff35;border-radius:20px;padding:24px;min-height:155px;transition:.25s;backdrop-filter:blur(12px)}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-5px);background:#ffffff25;border-color:#d3b2ff}
.card .emoji{font-size:30px;margin-bottom:16px}
.card h3{font-size:16px;line-height:1.7;margin:8px 0}

.btn{border:0;border-radius:12px;background:#a984f0;color:#160e30;padding:12px 18px;font-weight:bold}
.btn:hover{background:#d0b5ff}
.btn.secondary{background:#ffffff22;color:white;border:1px solid #ffffff40}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.section-title{font-size:26px;margin:20px 0}
.subnav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.subnav button{background:#ffffff17;color:white;border:1px solid #ffffff35;border-radius:20px;padding:9px 14px}
.subnav button.selected{background:#a984f0;color:#17122d}
input,textarea,select{display:block;width:100%;padding:13px;margin:8px 0 16px;background:#ffffffed;color:#201a39;border:1px solid #d5c7ee;border-radius:12px}
label{font-size:13px;color:#f0e9ff}
.modal-bg{position:fixed;inset:0;background:#090719c9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal{background:#242044;color:white;border:1px solid #8d71c0;border-radius:22px;padding:25px;width:min(540px,100%);max-height:90vh;overflow:auto}
.hidden{display:none!important}
.preview{max-width:100%;max-height:350px;border-radius:12px}
.filelink{color:#e6caff}
.empty{padding:35px;text-align:center;color:#e3d7f8;border:1px dashed #ffffff50;border-radius:18px;margin-top:20px}
.footer{text-align:center;color:#c8b8e2;padding:40px 0 10px;font-size:12px}
@media(max-width:850px){.layout{display:block}.sidebar{width:100%;padding:12px}.brand{padding:8px}.sidebar nav{display:flex;overflow-x:auto;gap:5px}.nav{min-width:170px;text-align:center}.main{padding:18px}.hero{padding:28px 20px}.top{flex-wrap:wrap}}

/* Restored introduction layouts */
.verse-card{text-align:center;padding:24px 18px;margin-bottom:22px;border:1px solid #d7bbff77;border-radius:18px;background:#ffffff12}
.verse-text{font-size:clamp(19px,2.5vw,26px);line-height:2.1;color:#f5eaff}
.verse-source{font-size:12px;color:#d7bbff;margin-top:8px}
.portfolio-copy{white-space:pre-wrap;line-height:2;text-align:right;overflow-wrap:anywhere}
.intro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.intro-card{min-height:unset;text-align:right}
.intro-card .portfolio-copy{margin:10px 0 0;color:#eee6fa;font-size:14px}
.goal-number{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:#a984f0;color:#1b1336;font-size:18px;font-weight:bold}
</style>

<script>

const SUPABASE_KEY="sb_publishable_xDPSz6NdX_KMCxnNTtOk8Q_NVJr9Juw";

const sections=[

 {name:"التنوع في استراتيجيات التدريس",icon:"🧩"},
 {name:"تحسين نتائج المتعلمين",icon:"📈"},

 {name:"توظيف تقنيات ووسائل التعلم المناسبة",icon:"💻"},
 {name:"تهيئة البيئة التعليمية",icon:"🏫"},
 {name:"الإدارة الصفية",icon:"🎯"},
 {name:"تحليل نتائج المتعلمين وتشخيص مستوياتهم",icon:"📊"},
 {name:"تنوع أساليب التقويم",icon:"📝"}
];
let current=-1,subCurrent="",admin=false,evidence=[];

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}
function validUrl(s){
 try{
  const u=new URL(s);
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch{return "";}
}
function nav(){
 document.getElementById("navigation").innerHTML=
 '<button class="nav '+(current===-1?'active':'')+'" onclick="openSection(-1)">⌂ الرئيسية</button>'+
 sections.map((s,i)=>
 '<button class="nav '+(current===i?'active':'')+
 '" onclick="openSection('+i+')">'+s.icon+" "+safe(s.name)+"</button>"
 ).join("");
}
function openSection(i,sub=""){
 current=i;subCurrent=sub;nav();render();
}
function render(){
 const el=document.getElementById("content");
 if(current===-1){
  el.innerHTML=`<div class="hero">
  
<img
  src="teacher-avatar.png"
  alt="معلمة تقنية رقمية"
  style="float:left;width:230px;max-width:42%;height:auto;border-radius:22px;margin:0 0 15px 22px;"
>

   <span class="tag">WELCOME TO MY DIGITAL WORLD</span>
   <h1>مرحبًا بكم في <span class="accent">عالم إنجازاتي</span></h1>
   
<p>
أنا حنين سعد الغامدي، خريجة جامعة الملك عبدالعزيز،
تخصص علوم الحاسب، ومعلمة تقنية رقمية.
أسعى إلى توظيف معرفتي التقنية وخبراتي التعليمية
في تقديم تجربة تعليمية محفزة للإبداع والابتكار،
وتنمية المهارات الرقمية لدى الطالبات.
ومن خلال ملف إنجازي الإلكتروني، أوثّق مسيرتي المهنية،
وممارساتي التعليمية، وأبرز إنجازاتي وشواهد أدائي.
</p>

   <button class="btn" onclick="openSection(0)">استكشف ملف الإنجاز ←</button>
  </div>
  <h2 class="section-title">استكشف الأقسام</h2>
  <div class="cards">`+
  sections.map((s,i)=>`<div class="card click" onclick="openSection(${i})">
   <div class="emoji">${s.icon}</div><h3>${safe(s.name)}</h3>
   <p>استعراض المحتوى والشواهد ←</p></div>`).join("")+
  "</div>";
  return;
 }
 
if(current===0){
 const pages=[
  {id:"introduction",name:"المقدمة"},
  {id:"vision_mission",name:"الرؤية والرسالة"},
  {id:"education_goals",name:"الأهداف العامة لسياسة التعليم في المملكة العربية السعودية"}
 ];
 const page=pages.find(p=>p.name===subCurrent)||pages[0];
 el.innerHTML=`
  <div class="hero">
   <span class="tag">ملف الإنجاز / المقدمة</span>
   <h1>📖 ${safe(page.name)}</h1>
  </div>
  <div class="subnav">
   ${pages.map(p=>`
    <button class="${page.id===p.id?'selected':''}"
     onclick="openSection(0,'${p.name}')">
     ${safe(p.name)}
    </button>
   `).join("")}
  </div>
  <div class="card" id="portfolio-text">
   <p>جاري تحميل المحتوى...</p>
  </div>
 `;
 loadPortfolioText(page.id);
 return;
}

 const s=sections[current];
 let html=`<div class="hero"><span class="tag">ملف الإنجاز / القسم ${current+1}</span>
 <h1>${s.icon} ${safe(s.name)}</h1>
 <p>${current===1?"أحرص على أداء واجباتي الوظيفية بكفاءة ومسؤولية، من خلال تنفيذ المبادرات التعليمية، والالتزام بتوزيع المنهج الدراسي، والمشاركة الفاعلة في الفعاليات والمناسبات الوطنية، وتفعيل حصص الاحتياط بما يحقق الاستفادة من الوقت التعليمي، ويسهم في تعزيز البيئة المدرسية وتحقيق الأهداف التربوية والتعليمية.":current===2?"أؤمن بأهمية التفاعل مع المجتمع المهني في تبادل الخبرات وتطوير الممارسات التعليمية، وأسعى إلى تعزيز التعاون المهني من خلال الزيارات التبادلية، والمشاركة في مجتمعات التعلم المهنية، وتقديم الدورات التدريبية والدروس التطبيقية، إلى جانب حضور البرامج التدريبية التي تسهم في تطوير مهاراتي المهنية، وتحسين جودة الأداء التعليمي، والارتقاء بمخرجات التعلم.":"استعرضي المحتوى والشواهد المرتبطة بهذا القسم."}</p></div>`;
 if(s.sub){
  html+='<div class="subnav">';
  s.sub.forEach((v,j)=>{

  });
  html+='</div>';
 }
 if(admin)html+='<div class="actions"><button class="btn" onclick="openAdd()">＋ إضافة شاهد</button></div>';
  // Keep older evidence visible in its original parent section without changing Supabase data.
  const legacySections=current===1?["شهادات الشكر والتقدير","الأنشطة الصفية واللاصفية"]:[];
 const list=evidence.filter(e=>e.section===(subCurrent||s.name)||
 (!subCurrent&&s.sub&&(s.sub.includes(e.section)||legacySections.includes(e.section))));
 html+='<div class="cards">'+list.map(e=>{
  const u=validUrl(e.file_url);
  const image=u&&/\.(png|jpg|jpeg|webp|gif)(\?|$)/i.test(u);
  return `<article class="card">
   <div class="emoji">📁</div>
   <h3>${safe(e.title)}</h3><p>${safe(e.description)}</p>
   ${image?'<img class="preview" src="'+safe(u)+'" alt="صورة الشاهد">':''}
   ${u?'<p><a class="filelink" href="'+safe(u)+'" target="_blank" rel="noopener noreferrer">فتح الشاهد ↗</a></p>':''}
    ${(e.attachments||[]).length?`<div style="margin-top:16px;text-align:right">
     <h4 style="color:#d7bbff">📎 مرفقات الشاهد</h4>
     ${(e.attachments||[]).map(file=>`<div style="background:#ffffff12;border:1px solid #ffffff30;border-radius:12px;padding:12px;margin:8px 0">
       <a class="filelink" href="${safe(validUrl(file.file_url)||'#')}" target="_blank" rel="noopener noreferrer">📄 ${safe(file.file_name)} ↗</a>
       ${admin?`<button class="btn secondary" style="margin:5px;padding:6px 10px;font-size:12px" onclick="removeAttachment('${file.id}')">حذف المرفق</button>`:""}
      </div>`).join("")}
     </div>`:""}
    ${admin?`<div class="actions"><button class="btn secondary" onclick="addAttachments('${e.id}')">＋ إضافة مرفقات</button></div>`:""}
${admin?'<div class="actions"><button class="btn" onclick="openEdit(\''+e.id+'\')">✏️ تعديل الشاهد</button><button class="btn secondary" onclick="removeEvidence(\''+e.id+'\')">حذف البطاقة</button></div>':''}
  </article>`;
 }).join("")+'</div>';
 if(!list.length)html+='<div class="empty">لا توجد شواهد منشورة في هذا القسم حتى الآن.</div>';
 el.innerHTML=html;
}
 
async function loadPortfolioText(pageId){
 const box=document.getElementById("portfolio-text");
 if(!box)return;

 try{
  const {data,error}=await db
   .from("portfolio_content")
   .select("content")
   .eq("id",pageId)
   .single();

  if(error)throw error;

  if(!document.getElementById("portfolio-text"))return;

  const content=data?.content||"";
 
// Preserve the original Supabase text while restoring the page layouts.
 const escaped=safe(content);
 let body="";
 if(pageId==="introduction"){
  body=`<div class="verse-card" dir="rtl"><div class="verse-text">﴿ وَقُلِ اعْمَلُوا فَسَيَرَى اللَّهُ عَمَلَكُمْ وَرَسُولُهُ وَالْمُؤْمِنُونَ ﴾</div><div class="verse-source">سورة التوبة، الآية ١٠٥</div></div><div class="portfolio-copy">${escaped||"لم تتم إضافة المحتوى بعد."}</div>`;
 }else if(pageId==="vision_mission"){
  const normalized=content.replace(/\r/g,"").trim();
  const visionMatch=normalized.match(/(?:^|\n)\s*(?:الرؤية|رؤيتي)\s*[:：\-–]?\s*/);
  const missionMatch=normalized.match(/(?:^|\n)\s*(?:الرسالة|رسالتي)\s*[:：\-–]?\s*/);
  let vision="",mission="";
  if(missionMatch){
   const at=missionMatch.index;
   vision=normalized.slice(visionMatch?visionMatch.index+visionMatch[0].length:0,at).trim();
   mission=normalized.slice(at+missionMatch[0].length).trim();
  }else{
   const chunks=normalized.split(/\n\s*\n/).filter(Boolean);
   if(chunks.length>=2){vision=chunks[0].replace(/^\s*(?:الرؤية|رؤيتي)\s*[:：\-–]?/,"").trim();mission=chunks.slice(1).join("\n\n").replace(/^\s*(?:الرسالة|رسالتي)\s*[:：\-–]?/,"").trim();}
   else vision=normalized.replace(/^\s*(?:الرؤية|رؤيتي)\s*[:：\-–]?/,"").trim();
  }
  body=`<div class="intro-grid"><div class="card intro-card"><div class="emoji">🔭</div><h3>الرؤية</h3><p class="portfolio-copy">${safe(vision)||"لم تتم إضافة نص الرؤية بعد."}</p></div><div class="card intro-card"><div class="emoji">✉️</div><h3>الرسالة</h3><p class="portfolio-copy">${safe(mission)||"لم تتم إضافة نص الرسالة بعد."}</p></div></div>`;
 }else if(pageId==="education_goals"){
  const normalized=content.replace(/\r/g,"").trim();
  let goals=normalized.split(/\n(?=\s*(?:[1-7١-٧][\s.)،\-–:]|[-•]))/).map(x=>x.trim()).filter(Boolean);
  if(goals.length<2)goals=normalized.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(goals.length<2)goals=normalized.split("\n").map(x=>x.trim()).filter(Boolean);
  goals=goals.map(g=>g.replace(/^\s*(?:[1-7١-٧][\s.)،\-–:]+|[-•]\s*)/,"").trim()).filter(Boolean);
  const nums=["١","٢","٣","٤","٥","٦","٧"];
  body=goals.length?`<div class="intro-grid">${goals.map((goal,i)=>`<div class="card intro-card"><div class="goal-number">${nums[i]||String(i+1)}</div><p class="portfolio-copy">${safe(goal)}</p></div>`).join("")}</div>`:'<div class="portfolio-copy">لم تتم إضافة المحتوى بعد.</div>';
 }
 box.innerHTML=`${body}${admin?`<div class="actions" style="margin-top:20px"><button class="btn" onclick="editPortfolioText('${pageId}')">✏️ تعديل المحتوى</button></div>`:""}`;

 }catch(error){
  box.textContent="تعذر تحميل المحتوى. يرجى المحاولة لاحقًا.";
  console.error(error);
 }
}
async function editPortfolioText(pageId){
 if(!admin)return;
 const {data,error}=await db.from("portfolio_content").select("content").eq("id",pageId).maybeSingle();
 if(error){alert("تعذر تحميل النص: "+error.message);return;}
 const updated=prompt("تعديل المحتوى:",data?.content||"");
 if(updated===null)return;
 const {error:saveError}=await db.from("portfolio_content").upsert({id:pageId,content:updated},{onConflict:"id"});
 if(saveError){alert("تعذر حفظ النص: "+saveError.message);return;}
 await loadPortfolioText(pageId);
}
function openModal(id){document.getElementById(id).classList.remove("hidden");}
function closeModal(id){document.getElementById(id).classList.add("hidden");}
function openAdd(){
 if(!admin)return;
 const s=sections[current];
 const opts=sections.flatMap(x=>x.sub||[x.name]);
 document.getElementById("eSection").innerHTML=opts.map(x=>
 '<option value="'+safe(x)+'" '+(x===(subCurrent||s.name)?'selected':'')+'>'+safe(x)+'</option>'
 ).join("");
 document.getElementById("addModal").classList.remove("hidden");
}
async function loadEvidence(){
 const {data,error}=await db.from("evidence").select("*").order("created_at",{ascending:false});
 if(error){console.error(error);return;}
 evidence=data||[];
 const {data:attachments,error:attachmentsError}=await db.from("evidence_attachments").select("*").order("created_at",{ascending:true});
 if(attachmentsError)console.error("تعذر تحميل المرفقات",attachmentsError);
 evidence.forEach(item=>{item.attachments=(attachments||[]).filter(file=>String(file.evidence_id)===String(item.id));});
 render();
}
const allowedFileTypes=["application/pdf","image/jpeg","image/png","image/webp","image/gif"];
function validateFiles(files){
 if(files.some(f=>f.size>10*1024*1024))throw Error("يجب ألا يتجاوز حجم كل ملف 10 ميجابايت");
 if(files.some(f=>!allowedFileTypes.includes(f.type)))throw Error("اختاري صورًا أو ملفات PDF فقط");
}
async function uploadAttachment(evidenceId,file){
 const ext=file.name.split(".").pop().toLowerCase();
 const path=crypto.randomUUID()+"."+ext;
 const {error:uploadError}=await db.storage.from("portfolio-files").upload(path,file,{contentType:file.type});
 if(uploadError)throw uploadError;
 const url=db.storage.from("portfolio-files").getPublicUrl(path).data.publicUrl;
 const {error:insertError}=await db.from("evidence_attachments").insert({evidence_id:evidenceId,file_name:file.name,file_url:url,file_type:file.type,storage_path:path});
 if(insertError){await db.storage.from("portfolio-files").remove([path]);throw insertError;}
 return path;
}
async function addAttachments(id){
 if(!admin)return;
 const picker=document.createElement("input");picker.type="file";picker.accept="image/*,.pdf";picker.multiple=true;
 picker.onchange=async()=>{
  const files=Array.from(picker.files||[]);if(!files.length)return;
  try{
   validateFiles(files);
   for(const file of files)await uploadAttachment(id,file);
   await loadEvidence();alert("تمت إضافة المرفقات بنجاح");
  }catch(e){console.error(e);await loadEvidence();alert("تعذر إكمال رفع المرفقات: "+e.message);}
 };
 picker.click();
}
async function removeAttachment(id){
 if(!admin||!confirm("هل تريدين حذف هذا المرفق نهائيًا؟"))return;
 const item=evidence.flatMap(e=>e.attachments||[]).find(f=>String(f.id)===String(id));
 if(!item)return;
 const {data,error}=await db.from("evidence_attachments").delete().eq("id",id).select("id");
 if(error||!data?.length){alert("تعذر حذف المرفق: "+(error?.message||"لم يُحذف السجل"));return;}
 if(item.storage_path){
  const {error:storageError}=await db.storage.from("portfolio-files").remove([item.storage_path]);
  if(storageError)alert("حُذف المرفق من البطاقة، لكن تعذر تنظيف الملف من التخزين.");
 }
 await loadEvidence();
}
async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();
 admin=false;
 if(user){
  const {data,error}=await db.from("portfolio_admins")
   .select("user_id").eq("user_id",user.id).maybeSingle();
  admin=!error&&!!data;
 }
 document.getElementById("authButton").textContent=admin?"تسجيل الخروج":"دخول الإدارة";
 render();
}
document.getElementById("authButton").onclick=async()=>{
 if(admin){
  await db.auth.signOut();admin=false;await checkAdmin();
 }else document.getElementById("loginModal").classList.remove("hidden");
};
document.getElementById("loginButton").onclick=async()=>{
 const b=document.getElementById("loginButton");
 const msg=document.getElementById("loginMessage");
 b.disabled=true;msg.textContent="جارٍ تسجيل الدخول...";
 try{
  const {error}=await db.auth.signInWithPassword({
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
  });
  if(error)throw error;
  await checkAdmin();
  if(!admin){await db.auth.signOut();throw Error("هذا الحساب غير مصرح له بالإدارة");}
  document.getElementById("password").value="";
  closeModal("loginModal");msg.textContent="";
 }catch(e){msg.textContent=e.message;}
 finally{b.disabled=false;}
};
document.getElementById("saveButton").onclick=async()=>{
 if(!admin)return;
 const b=document.getElementById("saveButton"),msg=document.getElementById("saveMessage");
 const title=document.getElementById("eTitle").value.trim();
 const section=document.getElementById("eSection").value;
 const description=document.getElementById("eDescription").value.trim();
 const files=Array.from(document.getElementById("eFile").files);
 const link=document.getElementById("eLink").value.trim();
 if(!title){msg.textContent="أدخلي عنوان الشاهد";return;}
 try{validateFiles(files);}catch(e){msg.textContent=e.message;return;}
 if(link&&!validUrl(link)){msg.textContent="الرابط غير صحيح";return;}
 b.disabled=true;msg.textContent="جارٍ حفظ الشاهد والمرفقات...";
 let evidenceId=null;const uploadedPaths=[];
 try{
  const {data:created,error:createError}=await db.from("evidence")
   .insert({title,section,description,file_url:validUrl(link)||null,file_type:link?"link":null}).select("id").single();
  if(createError)throw createError;
  evidenceId=created.id;
  for(const file of files)uploadedPaths.push(await uploadAttachment(evidenceId,file));
  closeModal("addModal");
  ["eTitle","eDescription","eLink","eFile"].forEach(id=>document.getElementById(id).value="");
  msg.textContent="";await loadEvidence();
 }catch(e){
  console.error(e);
  // Avoid deleting the new card if the rollback itself fails.
  if(evidenceId){const {error:rollbackError}=await db.from("evidence").delete().eq("id",evidenceId);if(rollbackError)console.error("Rollback failed",rollbackError);}
  if(uploadedPaths.length)await db.storage.from("portfolio-files").remove(uploadedPaths);
  msg.textContent="تعذر الحفظ: "+e.message;
 }finally{b.disabled=false;}
};

let editingId = null;

async function openEdit(id) {
 if (!admin) return;

  const item = evidence.find(e => e.id === id);
  if (!item) return;

  editingId = id;

  const title = prompt("تعديل اسم الشاهد:", item.title || "");
  if (title === null) return;
  if (!title.trim()) {
    alert("اسم الشاهد لا يمكن أن يكون فارغًا");
    return;
  }

  const description = prompt(
    "تعديل وصف الشاهد:",
    item.description || ""
  );
  if (description === null) return;

  const changes = {
    title: title.trim(),
    description: description.trim()
  };

  const replaceFile = confirm(
    "هل تريدين استبدال صورة الشاهد أو ملف PDF؟"
  );

  if (!replaceFile) {
    await saveEditedEvidence(changes);
    return;
  }

  const picker = document.createElement("input");
  picker.type = "file";
  picker.accept = "image/png,image/jpeg,image/webp,image/gif,application/pdf";

picker.onchange = async () => {
  picker.remove();    const file = picker.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      alert("حجم الملف يجب ألا يتجاوز 10 ميجابايت");
      return;
    }

    const allowed = [
      "image/png",
      "image/jpeg",
      "image/webp",
      "image/gif",
      "application/pdf"
    ];

    if (!allowed.includes(file.type)) {
      alert("اختاري صورة أو ملف PDF فقط");
      return;
    }

    const extension = file.name.split(".").pop().toLowerCase();
    const path = crypto.randomUUID() + "." + extension;

    try {
      const { error } = await db.storage
        .from("portfolio-files")
        .upload(path, file, { contentType: file.type });

      if (error) throw error;

      changes.file_url = db.storage
        .from("portfolio-files")
        .getPublicUrl(path).data.publicUrl;

      changes.file_type = file.type;

      const { data, error: updateError } = await db
        .from("evidence")
        .update(changes)
        .eq("id", editingId)
        .select("id");

      if (updateError) throw updateError;

      if (!data || data.length === 0) {
        throw new Error("لم يتم تحديث الشاهد");
      }

      editingId = null;
      await loadEvidence();
      alert("تم استبدال الملف وحفظ التعديلات بنجاح");

    } catch (error) {
      await db.storage.from("portfolio-files").remove([path]);
      alert("تعذر استبدال الملف: " + error.message);
    }
  };

document.body.appendChild(picker);
picker.click();
}

async function saveEditedEvidence(changes) {
  if (!admin || !editingId) return;

  const { data, error } = await db
    .from("evidence")
    .update(changes)
    .eq("id", editingId)
    .select("id");

  if (error) {
    alert("تعذر حفظ التعديل: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    alert("لم يتم تحديث الشاهد. تحققي من صلاحيات الإدارة.");
    return;
  }

  editingId = null;
  await loadEvidence();
  alert("تم حفظ التعديل بنجاح");
}

async function removeEvidence(id){
 if(!admin||!confirm("هل أنتِ متأكدة من حذف الشاهد وجميع مرفقاته نهائيًا؟ لا يمكن التراجع عن هذا الإجراء."))return;
 const item=evidence.find(e=>String(e.id)===String(id));
 if(!item)return;
 const paths=(item.attachments||[]).map(f=>f.storage_path).filter(Boolean);
 // Legacy uploaded file URLs are also stored in the same public bucket.
 const oldUrl=validUrl(item.file_url);
 const prefix=SUPABASE_URL+"/storage/v1/object/public/portfolio-files/";
 if(oldUrl.startsWith(prefix)){
  const oldPath=decodeURIComponent(oldUrl.slice(prefix.length).split("?")[0]);
  if(oldPath&&!oldPath.includes(".."))paths.push(oldPath);
 }
 const {data,error}=await db.from("evidence").delete().eq("id",id).select("id");
 if(error||!data?.length){alert("تعذر حذف الشاهد: "+(error?.message||"لم يُحذف السجل"));return;}
 if(paths.length){
  const {error:storageError}=await db.storage.from("portfolio-files").remove([...new Set(paths)]);
  if(storageError){console.error(storageError);alert("حُذفت البطاقة، لكن تعذر تنظيف بعض الملفات من التخزين.");}
 }
 await loadEvidence();
}
nav();render();loadEvidence();checkAdmin();
</script>
