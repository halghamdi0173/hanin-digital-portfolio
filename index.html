
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملف إنجاز حنين الغامدي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#7450ad 0%,#422a79 40%,#171a42 100%);background-attachment:fixed;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.layout{display:flex;min-height:100vh}
.sidebar{width:275px;flex-shrink:0;background:#14152b99;backdrop-filter:blur(18px);padding:24px 14px;border-left:1px solid #ffffff30}
.brand{text-align:center;padding:22px 8px;border-bottom:1px solid #ffffff25;margin-bottom:20px}
.brand .logo{font-size:38px;color:#d4b7ff}
.brand h2{font-size:18px;margin:10px 0}
.brand small{color:#c9b7ee}
.nav{display:block;width:100%;text-align:right;background:transparent;border:0;color:#e5def5;padding:13px;border-radius:12px;margin:4px 0;font-size:13px}
.nav:hover,.nav.active{background:#aa85f144;color:white}
.main{flex:1;min-width:0;padding:30px;max-width:1500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:30px}
.tag{border:1px solid #ffffff40;background:#ffffff12;border-radius:30px;padding:9px 15px;font-size:12px}
.hero{position:relative;overflow:hidden;padding:45px 36px;border:1px solid #ffffff40;border-radius:28px;background:#ffffff16;backdrop-filter:blur(20px);box-shadow:0 15px 50px #100e3030}
.hero:before{content:"✦";position:absolute;left:7%;top:12%;font-size:120px;color:#ffffff10}
.hero h1{font-size:clamp(28px,4vw,48px);margin:14px 0;color:#fff}
.hero p{color:#e7dff8;line-height:2;max-width:650px}
.accent{color:#d7bbff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px;margin-top:24px}
.card{background:#ffffff17;border:1px solid #ffffff35;border-radius:20px;padding:24px;min-height:155px;transition:.25s;backdrop-filter:blur(12px)}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-5px);background:#ffffff25;border-color:#d3b2ff}
.card .emoji{font-size:30px;margin-bottom:16px}
.card h3{font-size:16px;line-height:1.7;margin:8px 0}
.card p{font-size:13px;color:#ded5ee;line-height:1.8}
.btn{border:0;border-radius:12px;background:#a984f0;color:#160e30;padding:12px 18px;font-weight:bold}
.btn:hover{background:#d0b5ff}
.btn.secondary{background:#ffffff22;color:white;border:1px solid #ffffff40}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.section-title{font-size:26px;margin:20px 0}
.subnav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.subnav button{background:#ffffff17;color:white;border:1px solid #ffffff35;border-radius:20px;padding:9px 14px}
.subnav button.selected{background:#a984f0;color:#17122d}
input,textarea,select{display:block;width:100%;padding:13px;margin:8px 0 16px;background:#ffffffed;color:#201a39;border:1px solid #d5c7ee;border-radius:12px}
label{font-size:13px;color:#f0e9ff}
.modal-bg{position:fixed;inset:0;background:#090719c9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal{background:#242044;color:white;border:1px solid #8d71c0;border-radius:22px;padding:25px;width:min(540px,100%);max-height:90vh;overflow:auto}
.hidden{display:none!important}
.preview{max-width:100%;max-height:350px;border-radius:12px}
.filelink{color:#e6caff}
.empty{padding:35px;text-align:center;color:#e3d7f8;border:1px dashed #ffffff50;border-radius:18px;margin-top:20px}
.footer{text-align:center;color:#c8b8e2;padding:40px 0 10px;font-size:12px}
@media(max-width:850px){.layout{display:block}.sidebar{width:100%;padding:12px}.brand{padding:8px}.sidebar nav{display:flex;overflow-x:auto;gap:5px}.nav{min-width:170px;text-align:center}.main{padding:18px}.hero{padding:28px 20px}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
 <div class="brand">
  <div class="logo">✦</div>
  <h2>حنين الغامدي</h2>
  <small>DIGITAL PORTFOLIO</small>
 </div>
 <nav id="navigation"></nav>
</aside>
<main class="main">
 <header class="top">
  <span class="tag">✦ ملف الإنجاز المهني الرقمي</span>
  <button class="btn secondary" id="authButton">دخول الإدارة</button>
 </header>
 <div id="content"></div>
 <footer class="footer">حنين سعد الغامدي | Digital Portfolio</footer>
</main>
</div>

<div class="modal-bg hidden" id="loginModal">
 <div class="modal">
  <h2>🔐 دخول الإدارة</h2>
  <label>البريد الإلكتروني</label>
  <input id="email" type="email" autocomplete="username">
  <label>كلمة المرور</label>
  <input id="password" type="password" autocomplete="current-password">
  <div class="actions">
   <button class="btn" id="loginButton">تسجيل الدخول</button>
   <button class="btn secondary" onclick="closeModal('loginModal')">إلغاء</button>
  </div>
  <p id="loginMessage"></p>
 </div>
</div>

<div class="modal-bg hidden" id="addModal">
 <div class="modal">
  <h2>✦ إضافة شاهد جديد</h2>
  <label>عنوان الشاهد</label>
  <input id="eTitle" maxlength="180">
  <label>القسم</label>
  <select id="eSection"></select>
  <label>الوصف</label>
  <textarea id="eDescription" rows="3"></textarea>
  <label>صورة أو PDF (اختياري)</label>
  <input id="eFile" type="file" accept="image/*,.pdf">
  <label>رابط إلكتروني (اختياري)</label>
  <input id="eLink" type="url" placeholder="https://">
  <div class="actions">
   <button class="btn" id="saveButton">حفظ الشاهد</button>
   <button class="btn secondary" onclick="closeModal('addModal')">إلغاء</button>
  </div>
  <p id="saveMessage"></p>
 </div>
</div>

<script>
const SUPABASE_URL="https://dsaekbuosimyeubmuinh.supabase.co";
const SUPABASE_KEY="sb_publishable_xDPSz6NdX_KMCxnNTtOk8Q_NVJr9Juw";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const sections=[
 {name:"المقدمة",icon:"📖",sub:["المقدمة","الرؤية والرسالة","الأهداف العامة لسياسة التعليم في المملكة العربية السعودية"]},
 {name:"أداء الواجبات الوظيفية",icon:"💼",sub:["شهادات الشكر والتقدير","الأنشطة الصفية واللاصفية","توزيع المنهج الدراسي"]},
 {name:"التفاعل مع المجتمع المهني",icon:"👥"},
 {name:"التفاعل مع أولياء الأمور",icon:"💬"},
 {name:"التنوع في استراتيجيات التدريس",icon:"🧩"},
 {name:"تحسين نتائج المتعلمين",icon:"📈"},
 {name:"إعداد وتنفيذ خطة التعلم",icon:"📋"},
 {name:"توظيف تقنيات ووسائل التعلم المناسبة",icon:"💻"},
 {name:"تهيئة البيئة التعليمية",icon:"🏫"},
 {name:"الإدارة الصفية",icon:"🎯"},
 {name:"تحليل نتائج المتعلمين وتشخيص مستوياتهم",icon:"📊"},
 {name:"تنوع أساليب التقويم",icon:"📝"}
];
let current=-1,subCurrent="",admin=false,evidence=[];

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}
function validUrl(s){
 try{
  const u=new URL(s);
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch{return "";}
}
function nav(){
 document.getElementById("navigation").innerHTML=
 '<button class="nav '+(current===-1?'active':'')+'" onclick="openSection(-1)">⌂ الرئيسية</button>'+
 sections.map((s,i)=>
 '<button class="nav '+(current===i?'active':'')+
 '" onclick="openSection('+i+')">'+s.icon+" "+safe(s.name)+"</button>"
 ).join("");
}
function openSection(i,sub=""){
 current=i;subCurrent=sub;nav();render();
}
function render(){
 const el=document.getElementById("content");
 if(current===-1){
  el.innerHTML=`<div class="hero">
   <span class="tag">WELCOME TO MY DIGITAL WORLD</span>
   <h1>مرحبًا بكم في <span class="accent">عالم إنجازاتي</span></h1>
   
<p>
أنا حنين سعد الغامدي، خريجة جامعة الملك عبدالعزيز،
تخصص علوم الحاسب، ومعلمة تقنية رقمية.
أسعى إلى توظيف معرفتي التقنية وخبراتي التعليمية
في تقديم تجربة تعليمية محفزة للإبداع والابتكار،
وتنمية المهارات الرقمية لدى الطالبات.
ومن خلال ملف إنجازي الإلكتروني، أوثّق مسيرتي المهنية،
وممارساتي التعليمية، وأبرز إنجازاتي وشواهد أدائي.
</p>

   <button class="btn" onclick="openSection(0)">استكشف ملف الإنجاز ←</button>
  </div>
  <h2 class="section-title">استكشف الأقسام</h2>
  <div class="cards">`+
  sections.map((s,i)=>`<div class="card click" onclick="openSection(${i})">
   <div class="emoji">${s.icon}</div><h3>${safe(s.name)}</h3>
   <p>استعراض المحتوى والشواهد ←</p></div>`).join("")+
  "</div>";
  return;
 }
 const s=sections[current];
 let html=`<div class="hero"><span class="tag">ملف الإنجاز / القسم ${current+1}</span>
 <h1>${s.icon} ${safe(s.name)}</h1>
 <p>استعرضي المحتوى والشواهد المرتبطة بهذا القسم.</p></div>`;
 if(s.sub){
  html+='<div class="subnav"><button class="'+(!subCurrent?'selected':'')+
  '" onclick="openSection('+current+')">جميع الشواهد</button>';
  s.sub.forEach((v,j)=>{
   html+='<button class="'+(subCurrent===v?'selected':'')+
   '" onclick="openSection('+current+',sections['+current+'].sub['+j+'])">'+safe(v)+'</button>';
  });
  html+='</div>';
 }
 if(admin)html+='<div class="actions"><button class="btn" onclick="openAdd()">＋ إضافة شاهد</button></div>';
 const list=evidence.filter(e=>e.section===(subCurrent||s.name)||
 (!subCurrent&&s.sub&&s.sub.includes(e.section)));
 html+='<div class="cards">'+list.map(e=>{
  const u=validUrl(e.file_url);
  const image=u&&/\.(png|jpg|jpeg|webp|gif)(\?|$)/i.test(u);
  return `<article class="card">
   <div class="emoji">📁</div>
   <h3>${safe(e.title)}</h3><p>${safe(e.description)}</p>
   ${image?'<img class="preview" src="'+safe(u)+'" alt="صورة الشاهد">':''}
   ${u?'<p><a class="filelink" href="'+safe(u)+'" target="_blank" rel="noopener noreferrer">فتح الشاهد ↗</a></p>':''}
${admin?'<div class="actions"><button class="btn" onclick="openEdit(\''+e.id+'\')">✏️ تعديل الشاهد</button><button class="btn secondary" onclick="removeEvidence(\''+e.id+'\')">حذف البطاقة</button></div>':''}
  </article>`;
 }).join("")+'</div>';
 if(!list.length)html+='<div class="empty">لا توجد شواهد منشورة في هذا القسم حتى الآن.</div>';
 el.innerHTML=html;
}
function closeModal(id){document.getElementById(id).classList.add("hidden");}
function openAdd(){
 if(!admin)return;
 const s=sections[current];
 const opts=sections.flatMap(x=>x.sub||[x.name]);
 document.getElementById("eSection").innerHTML=opts.map(x=>
 '<option value="'+safe(x)+'" '+(x===(subCurrent||s.name)?'selected':'')+'>'+safe(x)+'</option>'
 ).join("");
 document.getElementById("addModal").classList.remove("hidden");
}
async function loadEvidence(){
 const {data,error}=await db.from("evidence").select("*").order("created_at",{ascending:false});
 if(error){console.error(error);return;}
 evidence=data||[];render();
}
async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();
 admin=false;
 if(user){
  const {data,error}=await db.from("portfolio_admins")
   .select("user_id").eq("user_id",user.id).maybeSingle();
  admin=!error&&!!data;
 }
 document.getElementById("authButton").textContent=admin?"تسجيل الخروج":"دخول الإدارة";
 render();
}
document.getElementById("authButton").onclick=async()=>{
 if(admin){
  await db.auth.signOut();admin=false;await checkAdmin();
 }else document.getElementById("loginModal").classList.remove("hidden");
};
document.getElementById("loginButton").onclick=async()=>{
 const b=document.getElementById("loginButton");
 const msg=document.getElementById("loginMessage");
 b.disabled=true;msg.textContent="جارٍ تسجيل الدخول...";
 try{
  const {error}=await db.auth.signInWithPassword({
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
  });
  if(error)throw error;
  await checkAdmin();
  if(!admin){await db.auth.signOut();throw Error("هذا الحساب غير مصرح له بالإدارة");}
  document.getElementById("password").value="";
  closeModal("loginModal");msg.textContent="";
 }catch(e){msg.textContent=e.message;}
 finally{b.disabled=false;}
};
document.getElementById("saveButton").onclick=async()=>{
 if(!admin)return;
 const b=document.getElementById("saveButton");
 const msg=document.getElementById("saveMessage");
 const title=document.getElementById("eTitle").value.trim();
 const section=document.getElementById("eSection").value;
 const description=document.getElementById("eDescription").value.trim();
 const file=document.getElementById("eFile").files[0];
 const link=document.getElementById("eLink").value.trim();
 if(!title){msg.textContent="أدخلي عنوان الشاهد";return;}
 if(file&&file.size>10*1024*1024){msg.textContent="الملف أكبر من 10 ميجابايت";return;}
 if(file&&!["application/pdf","image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){
  msg.textContent="اختاري صورة أو ملف PDF";return;
 }
 if(link&&!validUrl(link)){msg.textContent="الرابط غير صحيح";return;}
 b.disabled=true;msg.textContent="جارٍ حفظ الشاهد...";
 let path="";
 try{
  let file_url=validUrl(link),file_type=link?"link":null;
  if(file){
   const ext=file.name.split(".").pop().toLowerCase();
   path=crypto.randomUUID()+"."+ext;
   const {error}=await db.storage.from("portfolio-files").upload(path,file,{contentType:file.type});
   if(error)throw error;
   file_url=db.storage.from("portfolio-files").getPublicUrl(path).data.publicUrl;
   file_type=file.type;
  }
  const {error}=await db.from("evidence").insert({title,section,description,file_url,file_type});
  if(error)throw error;
  closeModal("addModal");
  ["eTitle","eDescription","eLink","eFile"].forEach(id=>document.getElementById(id).value="");
  msg.textContent="";
  await loadEvidence();
 }catch(e){
  msg.textContent="تعذر الحفظ: "+e.message;
  if(path)await db.storage.from("portfolio-files").remove([path]);
 }finally{b.disabled=false;}
};
 
let editingId = null;

async function openEdit(id) {
 if (!admin) return;

  const item = evidence.find(e => e.id === id);
  if (!item) return;

  editingId = id;

  const title = prompt("تعديل اسم الشاهد:", item.title || "");
  if (title === null) return;
  if (!title.trim()) {
    alert("اسم الشاهد لا يمكن أن يكون فارغًا");
    return;
  }

  const description = prompt(
    "تعديل وصف الشاهد:",
    item.description || ""
  );
  if (description === null) return;

  const changes = {
    title: title.trim(),
    description: description.trim()
  };

  const replaceFile = confirm(
    "هل تريدين استبدال صورة الشاهد أو ملف PDF؟"
  );

  if (!replaceFile) {
    await saveEditedEvidence(changes);
    return;
  }

  const picker = document.createElement("input");
  picker.type = "file";
  picker.accept = "image/png,image/jpeg,image/webp,image/gif,application/pdf";

picker.onchange = async () => {
  picker.remove();    const file = picker.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      alert("حجم الملف يجب ألا يتجاوز 10 ميجابايت");
      return;
    }

    const allowed = [
      "image/png",
      "image/jpeg",
      "image/webp",
      "image/gif",
      "application/pdf"
    ];

    if (!allowed.includes(file.type)) {
      alert("اختاري صورة أو ملف PDF فقط");
      return;
    }

    const extension = file.name.split(".").pop().toLowerCase();
    const path = crypto.randomUUID() + "." + extension;

    try {
      const { error } = await db.storage
        .from("portfolio-files")
        .upload(path, file, { contentType: file.type });

      if (error) throw error;

      changes.file_url = db.storage
        .from("portfolio-files")
        .getPublicUrl(path).data.publicUrl;

      changes.file_type = file.type;

      const { data, error: updateError } = await db
        .from("evidence")
        .update(changes)
        .eq("id", editingId)
        .select("id");

      if (updateError) throw updateError;

      if (!data || data.length === 0) {
        throw new Error("لم يتم تحديث الشاهد");
      }

      editingId = null;
      await loadEvidence();
      alert("تم استبدال الملف وحفظ التعديلات بنجاح");

    } catch (error) {
      await db.storage.from("portfolio-files").remove([path]);
      alert("تعذر استبدال الملف: " + error.message);
    }
  };

document.body.appendChild(picker);
picker.click();
}

async function saveEditedEvidence(changes) {
  if (!admin || !editingId) return;

  const { data, error } = await db
    .from("evidence")
    .update(changes)
    .eq("id", editingId)
    .select("id");

  if (error) {
    alert("تعذر حفظ التعديل: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    alert("لم يتم تحديث الشاهد. تحققي من صلاحيات الإدارة.");
    return;
  }

  editingId = null;
  await loadEvidence();
  alert("تم حفظ التعديل بنجاح");
}

async function removeEvidence(id){
 if(!admin||!confirm("هل تريدين حذف بطاقة الشاهد؟"))return;
 const {error}=await db.from("evidence").delete().eq("id",id);
 if(error)alert(error.message);
 else await loadEvidence();
}
nav();render();loadEvidence();checkAdmin();
</script>
</body>
</html>
